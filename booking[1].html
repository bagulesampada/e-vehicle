<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoDrive | Book a Test Drive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <nav>
      <div class="logo">EcoDrive</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="vehicles.html">Vehicles</a></li>
        <li><a href="charging.html">Charging</a></li>
        <li><a href="booking.html">Booking</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="content">
    <h1>Book a Test Drive</h1>
    <form>
      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email Address" required />
      <input type="tel" placeholder="Phone Number" required />
      <select required>
        <option value="">Select Vehicle Model</option>
        <option value="EcoBike 200">EcoBike 200</option>
        <option value="EcoCar Z">EcoCar Z</option>
      </select>
      <input type="date" required />
      <input type="time" required />
      <button type="submit" class="btn">Book Now</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 EcoDrive. All rights reserved.</p>
  </footer>
</body>
</html>
